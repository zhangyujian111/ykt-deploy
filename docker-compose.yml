# ykt-deploy — 生产编排
#
# 全部业务数据进单库 ykt（MySQL），RAG 向量检索独立为 PostgreSQL/pgvector。
#
# 启动前：cp .env.example .env 并填好变量；sh deploy.sh

services:
  mysql:
    image: mysql:8.0
    dns:
      - 127.0.0.11
      - 223.5.5.5
    container_name: ykt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ykt
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=200
      - --innodb_buffer_pool_size=512M
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动时自动初始化 schema（务必先放好合并后的单库 SQL 文件）
      - ./migrations/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    dns:
      - 127.0.0.11
      - 223.5.5.5
    container_name: ykt-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    dns:
      - 127.0.0.11
      - 223.5.5.5
    container_name: ykt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  xiaozhi-server:
    image: ${ALIYUN_ACR_REGISTRY}/${ALIYUN_ACR_NAMESPACE}/xiaozhi-server:latest
    container_name: ykt-xiaozhi-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 127.0.0.11
      - 223.5.5.5
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 覆盖镜像内置的兜底配置（必须挂载，否则用不到生产数据库地址）
      - ./configs/xiaozhi-server-go/config.yaml:/app/configs/config.yaml:ro
    expose:
      - "8080"

  xiaozhi-server-admin:
    image: ${ALIYUN_ACR_REGISTRY}/${ALIYUN_ACR_NAMESPACE}/xiaozhi-server-admin:latest
    container_name: ykt-xiaozhi-admin-web
    restart: unless-stopped
    depends_on:
      - xiaozhi-server
    dns:
      - 127.0.0.11
      - 223.5.5.5
    expose:
      - "80"

  ykt-admin-go:
    image: ${ALIYUN_ACR_REGISTRY}/${ALIYUN_ACR_NAMESPACE}/ykt-admin-go:latest
    container_name: ykt-admin-go
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    dns:
      - 127.0.0.11
      - 223.5.5.5
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./configs/ykt-admin-go/config.yaml:/app/configs/config.yaml:ro
    expose:
      - "8090"

  ykt-admin-console:
    image: ${ALIYUN_ACR_REGISTRY}/${ALIYUN_ACR_NAMESPACE}/ykt-admin-console:latest
    container_name: ykt-admin-console-web
    restart: unless-stopped
    depends_on:
      - ykt-admin-go
    dns:
      - 127.0.0.11
      - 223.5.5.5
    expose:
      - "80"

  ykt-aisaas:
    image: ${ALIYUN_ACR_REGISTRY}/${ALIYUN_ACR_NAMESPACE}/ykt-aisaas:latest
    container_name: ykt-aisaas
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    dns:
      - 127.0.0.11
      - 223.5.5.5
    environment:
      TZ: Asia/Shanghai
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
    volumes:
      - ./configs/ykt-aisaas/config.yaml:/app/config.yaml:ro
      - ./keys/aisaas:/app/keys:ro
    expose:
      - "8190"

  ykt-aisaas-portal:
    image: ${ALIYUN_ACR_REGISTRY}/${ALIYUN_ACR_NAMESPACE}/ykt-aisaas-portal:latest
    container_name: ykt-aisaas-portal-web
    restart: unless-stopped
    depends_on:
      - ykt-aisaas
    dns:
      - 127.0.0.11
      - 223.5.5.5
    expose:
      - "80"

  # muliti-toy 是统一入口，把 /api/v1 转给 ykt-aisaas、/api 转给 ykt-admin-go
  muliti-toy:
    image: ${ALIYUN_ACR_REGISTRY}/${ALIYUN_ACR_NAMESPACE}/muliti-toy:latest
    container_name: ykt-muliti-toy
    restart: unless-stopped
    depends_on:
      - ykt-admin-go
      - ykt-aisaas
    dns:
      - 127.0.0.11
      - 223.5.5.5
    expose:
      - "80"

  # edge nginx：唯一对外端口 8088，把所有路径转给内部各服务
  edge-nginx:
    image: nginx:alpine
    container_name: ykt-edge-nginx
    restart: unless-stopped
    depends_on:
      - muliti-toy
      - xiaozhi-server
      - ykt-admin-console
      - ykt-aisaas-portal
      - xiaozhi-server-admin
    dns:
      - 127.0.0.11
      - 223.5.5.5
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:8088"

volumes:
  mysql-data:
  redis-data:
  postgres-data:
