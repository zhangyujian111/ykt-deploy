# ykt-deploy edge nginx
# 单对外端口 8088（与原 Java nginx 一致），所有后端路由都通过这台 nginx 转发
#
# 路由表：
#   /                       -> muliti-toy:80          (SPA + /api/ + /api/v1/)
#   /api/device/ota         -> xiaozhi-server:8080    (ESP32 设备 OTA)
#   /api/device/ota/...     -> xiaozhi-server:8080
#   /ws/:deviceId           -> xiaozhi-server:8080    (WebSocket dialogue)
#   /api/xz/*               -> xiaozhi-server:8080    (xiaozhi-admin SPA API)
#   /api/aisaas/*           -> ykt-aisaas:8190        (xiaozhi-admin SPA API)
#   /internal/*             -> ykt-aisaas:8190        (运营后台 internal)
#   /admin/, /admin/assets/ -> ykt-admin-console:80   (管理控制台 Web)
#   /portal/, /portal/assets/ -> ykt-aisaas-portal:80 (aisaas 用户门户)
#   /xiaozhi-admin/, /xiaozhi-admin/assets/ -> ykt-xiaozhi-server-admin:80 (xiaozhi 设备管理)
#
# sub_filter 把 index.html 里的绝对路径 /assets/ 改写到 /<section>/assets/，
# 否则浏览器拿到的 SPA JS/CSS 路径会被边缘 nginx 兜底转发到错误的位置。

upstream toy          { server ykt-muliti-toy:80; }
upstream xz           { server ykt-xiaozhi-server:8080; }
upstream aisaas       { server ykt-aisaas:8190; }
upstream admin_web    { server ykt-admin-console-web:80; }
upstream portal_web   { server ykt-aisaas-portal-web:80; }
upstream xz_admin_web { server ykt-xiaozhi-admin-web:80; }

server {
    listen 8088;
    server_name _;

    client_max_body_size 50m;

    # ESP32 设备 OTA（先于 /api/ 匹配，避免被 muliti-toy 接管）
    location ~ ^/api/device/ota(/.*)?$ {
        proxy_pass http://xz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # xiaozhi WebSocket dialogue（设备 ↔ 服务端长连接）
    location /ws/ {
        proxy_pass http://xz;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # xiaozhi-admin SPA API 路由（不带 /xiaozhi-admin/ 前缀，浏览器 origin-relative）
    # /api/xz/*     -> xiaozhi-server:8080（剥前缀）
    location /api/xz/ {
        rewrite ^/api/xz/(.*)$ /$1 break;
        proxy_pass http://xz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /api/aisaas/* -> ykt-aisaas:8190（剥前缀，rewrite 后实际命中 /v1/* 等）
    location /api/aisaas/ {
        rewrite ^/api/aisaas/(.*)$ /$1 break;
        proxy_pass http://aisaas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /internal/api/* -> ykt-aisaas:8190
    location /internal/ {
        proxy_pass http://aisaas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理控制台 Web
    # 1. 静态资源（被 sub_filter 重写后的 URL）
    location /admin/assets/ {
        proxy_pass http://admin_web/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. SPA HTML（sub_filter 把 /assets/ 重写为 /admin/assets/）
    location /admin/ {
        proxy_pass http://admin_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter 'href="/assets/' 'href="/admin/assets/';
        sub_filter 'src="/assets/' 'src="/admin/assets/';
        sub_filter 'src="/vite.svg' 'src="/admin/vite.svg';
        sub_filter_once off;
        sub_filter_types application/javascript text/css;
        proxy_intercept_errors on;
        error_page 404 = @admin_spa_fallback;
    }

    location @admin_spa_fallback {
        rewrite ^ /index.html break;
        proxy_pass http://admin_web;
        proxy_set_header Host $host;
        sub_filter 'href="/assets/' 'href="/admin/assets/';
        sub_filter 'src="/assets/' 'src="/admin/assets/';
        sub_filter 'src="/vite.svg' 'src="/admin/vite.svg';
        sub_filter_once off;
        sub_filter_types application/javascript text/css;
    }

    # aisaas 用户门户
    location /portal/assets/ {
        proxy_pass http://portal_web/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /portal/ {
        proxy_pass http://portal_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter 'href="/assets/' 'href="/portal/assets/';
        sub_filter 'src="/assets/' 'src="/portal/assets/';
        sub_filter 'src="/vite.svg' 'src="/portal/vite.svg';
        sub_filter_once off;
        sub_filter_types application/javascript text/css;
        proxy_intercept_errors on;
        error_page 404 = @portal_spa_fallback;
    }

    location @portal_spa_fallback {
        rewrite ^ /index.html break;
        proxy_pass http://portal_web;
        proxy_set_header Host $host;
        sub_filter 'href="/assets/' 'href="/portal/assets/';
        sub_filter 'src="/assets/' 'src="/portal/assets/';
        sub_filter 'src="/vite.svg' 'src="/portal/vite.svg';
        sub_filter_once off;
        sub_filter_types application/javascript text/css;
    }

    # xiaozhi 设备管理 Web
    location /xiaozhi-admin/assets/ {
        proxy_pass http://xz_admin_web/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /xiaozhi-admin/ {
        proxy_pass http://xz_admin_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter 'href="/assets/' 'href="/xiaozhi-admin/assets/';
        sub_filter 'src="/assets/' 'src="/xiaozhi-admin/assets/';
        sub_filter 'src="/vite.svg' 'src="/xiaozhi-admin/vite.svg';
        sub_filter_once off;
        sub_filter_types application/javascript text/css;
        proxy_intercept_errors on;
        error_page 404 = @xz_admin_spa_fallback;
    }

    location @xz_admin_spa_fallback {
        rewrite ^ /index.html break;
        proxy_pass http://xz_admin_web;
        proxy_set_header Host $host;
        sub_filter 'href="/assets/' 'href="/xiaozhi-admin/assets/';
        sub_filter 'src="/assets/' 'src="/xiaozhi-admin/assets/';
        sub_filter 'src="/vite.svg' 'src="/xiaozhi-admin/vite.svg';
        sub_filter_once off;
        sub_filter_types application/javascript text/css;
    }

    # 兜底：muliti-toy 统一入口
    #   /           -> SPA index.html
    #   /api/v1/*   -> ykt-aisaas:8190
    #   /api/*      -> ykt-admin-go:8090
    location / {
        proxy_pass http://toy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
